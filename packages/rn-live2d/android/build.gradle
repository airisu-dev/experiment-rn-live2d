buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.8.0"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: 'org.jetbrains.kotlin.android'
apply from: '../nitrogen/generated/android/RnLive2d+autolinking.gradle'
apply from: "./fix-prefab.gradle"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

// Cubism SDK for Native: proprietary, so each app downloads it from Live2D and
// sets its folder (app.plugin.js writes rnLive2d.cubismSdkPath, relative to android/).
def cubismSdkDir() {
  def configured = System.getenv("RN_LIVE2D_CUBISM_SDK") ?: rootProject.findProperty("rnLive2d.cubismSdkPath")
  if (!configured) {
    throw new GradleException("[rn-live2d] Cubism SDK for Native isn't configured. Add the plugin to app.json: " +
      "[\"rn-live2d\", { \"cubismSdkPath\": \"./vendor/CubismSdkForNative\" }], download the SDK with `rn-live2d fetch-sdk --accept-license` (through npx, bunx, yarn or pnpm), then prebuild.")
  }
  def dir = rootProject.file(configured)
  def info = new File(dir, "cubism-info.yml")
  if (!info.exists()) {
    throw new GradleException("[rn-live2d] Cubism SDK for Native not found at ${dir} (no cubism-info.yml). " +
      "Download it with `rn-live2d fetch-sdk --accept-license` (through npx, bunx, yarn or pnpm).")
  }
  def matcher = info.text =~ /(?m)^version:\s*(\S+)/
  def version = matcher.find() ? matcher.group(1) : "unknown"
  def supported = new groovy.json.JsonSlurper().parse(file("../package.json")).cubismSdk.version
  if (version.tokenize("-")[0] != supported.tokenize("-")[0]) {
    throw new GradleException("[rn-live2d] Cubism SDK for Native ${version} at ${dir} isn't supported: use ${supported}.")
  }
  if (version != supported) {
    logger.warn("[rn-live2d] Cubism SDK for Native ${version} found, tested with ${supported}.")
  }
  return dir.absolutePath.replace("\\", "/")
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["RnLive2d_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["RnLive2d_" + name]).toInteger()
}

android {
  namespace "com.rnlive2d"

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
          "-DCUBISM_SDK_DIR=${cubismSdkDir()}"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packagingOptions {
    excludes = [
        "META-INF",
        "META-INF/**",
        "**/libc++_shared.so",
        "**/libfbjni.so",
        "**/libjsi.so",
        "**/libfolly_json.so",
        "**/libfolly_runtime.so",
        "**/libglog.so",
        "**/libhermes.so",
        "**/libhermes-executor-debug.so",
        "**/libhermes_executor.so",
        "**/libreactnative.so",
        "**/libreactnativejni.so",
        "**/libturbomodulejsijni.so",
        "**/libreact_nativemodule_core.so",
        "**/libjscexecutor.so"
    ]
  }

  buildFeatures {
    buildConfig true
    prefab true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
        java.srcDirs += [
          // React Codegen files
          "${project.buildDir}/generated/source/codegen/java"
        ]
      }
    }
  }
}

repositories {
  mavenCentral()
  google()
}


dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"

  // Add a dependency on NitroModules
  implementation project(":react-native-nitro-modules")
}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src/")
    libraryName = "RnLive2d"
    codegenJavaPackageName = "com.rnlive2d"
  }
}